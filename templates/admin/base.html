{{define "base"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>{{block "title" .}}{{.Title}} · 管理后台{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/prose.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("blog-theme");
        if (saved !== "light" && saved !== "dark") {
          saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body class="admin-shell{{if not .Nav}} is-bare{{end}}">
{{if .Nav}}
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-brand">
      <span class="admin-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/><path d="M9 7h6"/></svg>
      </span>
      <div>
        <p class="admin-brand-title">{{.SiteTitle}}</p>
        <p class="admin-brand-sub">管理后台</p>
      </div>
    </div>

    <nav class="admin-nav" aria-label="后台导航">
      <a href="/admin" {{if eq .Nav "dashboard"}}class="is-active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        仪表盘
      </a>
      <a href="/admin/posts" {{if eq .Nav "posts"}}class="is-active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        文章
      </a>
      <a href="/admin/tags" {{if eq .Nav "tags"}}class="is-active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        标签
      </a>
      <a href="/admin/settings" {{if eq .Nav "settings"}}class="is-active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        站点设置
      </a>
      <a href="/admin/account" {{if eq .Nav "account"}}class="is-active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        账号
      </a>
    </nav>

    <div class="admin-sidebar-foot">
      <a href="/" target="_blank" rel="noopener noreferrer">查看站点 ↗</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <button type="submit" class="admin-logout">退出登录</button>
      </form>
    </div>
  </aside>

  <div class="nav-scrim" id="nav-scrim" hidden></div>
{{end}}

  <div class="admin-main">
    {{if .Nav}}
    <header class="admin-topbar">
      <button class="admin-menu-btn" id="admin-menu-toggle" type="button" aria-label="切换侧边栏" aria-expanded="false">☰</button>
      <h1 class="admin-page-title">{{.Title}}</h1>
      <div class="admin-topbar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色/浅色主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <span class="admin-user">{{.Username}}</span>
      </div>
    </header>
    {{end}}

    <main class="admin-content">
      {{if .Flash}}<div class="flash flash-{{.Flash.Kind}}">{{.Flash.Message}}</div>{{end}}
      {{template "content" .}}
    </main>
  </div>

  <script src="/static/js/admin.js" defer></script>
</body>
</html>{{end}}

{{define "title"}}登录 · 管理后台{{end}}

{{define "content"}}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/login" autocomplete="on" id="login-form">
    <div class="login-head">
      <span class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <h1>管理后台</h1>
      <p>{{.SiteTitle}}</p>
    </div>

    {{if .Error}}
      <div class="flash flash-error" role="alert">{{.Error}}</div>
    {{end}}

    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">

    <label class="field">
      <span class="field-label">用户名</span>
      <input type="text" name="username" required autofocus autocomplete="username" placeholder="admin">
    </label>

    <label class="field">
      <span class="field-label">密码</span>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </label>

    {{if eq .CaptchaMode "image"}}
      <div class="field">
        <label class="field-label" for="captcha-input">验证码</label>
        <div class="captcha-row">
          <input id="captcha-input" type="text" name="captcha" required
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 maxlength="8" placeholder="图中字符"
                 aria-describedby="captcha-hint">
          <button type="button" class="captcha-image" id="captcha-refresh"
                  title="看不清？点击换一张" aria-label="刷新验证码">
            <img id="captcha-img" src="{{.CaptchaURL}}" alt="验证码图片"
                 width="180" height="56" draggable="false">
          </button>
        </div>
        <span class="field-hint" id="captcha-hint">不区分大小写，看不清可点击图片换一张</span>
      </div>
    {{else if eq .CaptchaMode "slider"}}
      <div class="field">
        <span class="field-label">安全验证</span>

        <div class="slider-captcha" id="slider-captcha"
             data-challenge-url="/admin/captcha/slider"
             data-verify-url="/admin/captcha/verify"
             style="--stage-ratio: {{.Slider.Width}} / {{.Slider.Height}}">

          <div class="slider-stage" id="slider-stage">
            <img class="slider-bg" id="slider-bg" alt="" draggable="false">
            <img class="slider-piece" id="slider-piece" alt="" draggable="false">
            <div class="slider-mask" id="slider-mask" hidden>
              <span class="slider-mask-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="slider-mask-text">验证通过</span>
            </div>
          </div>

          <div class="slider-track" id="slider-track">
            <div class="slider-fill" id="slider-fill"></div>
            <span class="slider-track-hint" id="slider-track-hint">按住滑块，拖动完成拼图</span>
            <div class="slider-handle" id="slider-handle" role="slider" tabindex="0"
                 aria-label="拖动滑块完成拼图"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </div>
          </div>

          <div class="slider-foot">
            <span class="field-hint" id="slider-status" role="status">拖动滑块，让拼图块与缺口对齐</span>
            <button type="button" class="slider-refresh" id="slider-refresh">换一张</button>
          </div>

          <input type="hidden" name="captcha_ticket" id="captcha-ticket" value="">
        </div>
      </div>
    {{end}}

    <button class="btn btn-primary btn-block" type="submit">登录</button>

    <p class="field-hint" style="text-align:center;margin:0">
      首次部署请使用启动时配置的管理员账号登录
    </p>
  </form>
</div>
{{end}}

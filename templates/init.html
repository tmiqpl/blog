{{define "init"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>站点初始化</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/prose.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("blog-theme");
        if (saved !== "light" && saved !== "dark") {
          saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body class="init-page">
  <main class="init-shell">
    <header class="init-head">
      <span class="init-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/><path d="M9 7h6"/></svg>
      </span>
      <h1>站点初始化</h1>
      <p class="init-lead">
        这是站点第一次启动，还没有任何配置。填好下面的信息就能开始使用，
        完成后本页面会自动关闭，之后请从 <code>/admin</code> 登录后台。
      </p>
    </header>

    {{if .Error}}
    <div class="init-alert" role="alert">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <form class="init-form" method="post" action="{{.InitAction}}" autocomplete="off" novalidate>
      <input type="hidden" name="_csrf" value="{{.CSRF}}">

      <section class="init-section">
        <h2 class="init-section-title">站点信息</h2>

        <div class="init-field">
          <label for="title">站点标题 <span class="init-req">*</span></label>
          <input id="title" name="title" type="text" value="{{.Form.Title}}"
                 maxlength="200" required autofocus placeholder="例如：我的博客">
          <p class="init-help">显示在浏览器标签页、页头与页脚。</p>
        </div>

        <div class="init-field">
          <label for="description">站点描述</label>
          <input id="description" name="description" type="text" value="{{.Form.Description}}"
                 maxlength="200" placeholder="一句话介绍这个站点">
        </div>

        <div class="init-row">
          <div class="init-field">
            <label for="author">作者</label>
            <input id="author" name="author" type="text" value="{{.Form.Author}}" maxlength="200">
          </div>
          <div class="init-field">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" value="{{.Form.Email}}"
                   maxlength="200" placeholder="you@example.com">
          </div>
        </div>

        <div class="init-field">
          <label for="bio">作者简介</label>
          <textarea id="bio" name="bio" rows="2" maxlength="200"
                    placeholder="会显示在侧边栏与关于页">{{.Form.Bio}}</textarea>
        </div>

        <div class="init-row">
          <div class="init-field">
            <label for="github">GitHub 地址</label>
            <input id="github" name="github" type="text" value="{{.Form.GitHub}}"
                   maxlength="200" placeholder="https://github.com/yourname">
          </div>
          <div class="init-field">
            <label for="icp">备案号</label>
            <input id="icp" name="icp" type="text" value="{{.Form.ICP}}"
                   maxlength="200" placeholder="留空则不显示">
          </div>
        </div>
      </section>

      <section class="init-section">
        <h2 class="init-section-title">管理员账号</h2>
        <p class="init-section-note">
          用于登录 <code>/admin</code> 管理后台。密码以 PBKDF2 加盐哈希存储，数据库里没有明文。
        </p>

        <div class="init-field">
          <label for="username">用户名 <span class="init-req">*</span></label>
          <input id="username" name="username" type="text" value="{{.Form.Username}}"
                 maxlength="60" required autocomplete="off">
        </div>

        <div class="init-row">
          <div class="init-field">
            <label for="password">密码 <span class="init-req">*</span></label>
            <input id="password" name="password" type="password"
                   minlength="8" required autocomplete="new-password" placeholder="至少 8 位">
          </div>
          <div class="init-field">
            <label for="confirm_password">确认密码 <span class="init-req">*</span></label>
            <input id="confirm_password" name="confirm_password" type="password"
                   minlength="8" required autocomplete="new-password" placeholder="再输入一次">
          </div>
        </div>
      </section>

      {{if .Seedable}}
      <section class="init-section">
        <h2 class="init-section-title">初始内容</h2>
        <label class="init-check">
          <input type="checkbox" name="seed_samples" value="1" {{if .Form.SeedSamples}}checked{{end}}>
          <span>
            写入 5 篇示例文章
            <small>便于立刻看到排版效果，之后可在后台随时删除。</small>
          </span>
        </label>
      </section>
      {{end}}

      <div class="init-actions">
        <button class="init-submit" type="submit">完成初始化</button>
        <p class="init-foot">
          提交后本页面将不再对外开放。若填错了信息，可登录后台在「站点设置」里修改。
        </p>
      </div>
    </form>
  </main>
</body>
</html>{{end}}
